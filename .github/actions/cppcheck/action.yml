name: 'Run cppcheck'
description: 'Install and run cppcheck'

runs:
  using: "composite"
  steps:
    - name: Cache cppcheck
   
      uses: actions/cache/restore@v6.1.0
      id: cache-cppcheck
      with:
        path: cppcheck
        key: cppcheck-${{ env.CPPCHECK_VER }}-v2

    - name: Install packages
      uses: ./.github/actions/install-packages

    - name: Build cppcheck
      shell: bash
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      run: |
        bash ./scripts/build_cppcheck.sh -v ${CPPCHECK_VER}

    - name: Save cppcheck cache
      
      uses: actions/cache/save@v6.1.0
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      with:
        path: cppcheck
        key: cppcheck-${{ env.CPPCHECK_VER }}-v2

    - name: Install cppcheck
      shell: bash
      
      run: |
        cd cppcheck
        cmake --build build -j$(nproc)
        sudo cmake --install build

    - name: Configure CMake
      uses: ./.github/actions/configure-cmake
      with:
        custom_flags: '-GNinja'
        cache_key: 'cache-cppcheck'

    - name: Cppcheck and friends
      shell: bash
      run: |
        bash ./scripts/audit_ext_libs.sh
        bash ./scripts/run_cppcheck.sh
